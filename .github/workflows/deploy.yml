name: Deploy

on:
  push:
    branches: [main]
  # Build PRs too, so dependency updates are checked before they reach main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Links and canonical URLs end with a slash (/making/), but Void writes
      # making.html, and GitHub Pages answers /making/ with a 404 unless
      # making/index.html exists.
      - run: |
          find dist/client -name '*.html' ! -name index.html ! -name 404.html | while read -r file; do
            mkdir -p "${file%.html}"
            mv "$file" "${file%.html}/index.html"
          done
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
