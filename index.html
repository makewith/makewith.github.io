<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Makewith は新しいものを準備中です。">
    <title>Makewith</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #f5f5f4;
          --muted: #a8a29e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5em;
        font-size: 2.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Makewith</h1>
      <p>新しいものを準備中です。</p>
    </main>
  </body>
</html>
